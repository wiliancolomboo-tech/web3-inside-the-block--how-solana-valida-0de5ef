[package]
name = "solana-order-engine"
version = "1.0.0"
edition = "2021"
authors = ["Solana Principal Infrastructure Architect"]
description = "Deterministic Validator BankingStage & Jito Scheduler Emulation Engine"

[[bin]]
name = "solana-blockscope-cli"
path = "src/main.rs"

[lib]
name = "solana_order_engine"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"