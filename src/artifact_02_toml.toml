[package]
name = "solana-block-ordering-engine"
version = "0.1.0"
edition = "2021"
authors = ["Enterprise Solana Core Architecture Team"]
description = "Deterministic Solana Banking Stage Transaction Ordering Simulator and Conflict Graph"

[dependencies]
solana-sdk = "1.18.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
sha2 = "0.10"