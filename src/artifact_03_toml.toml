[package]
name = "solana-block-orderer"
version = "0.1.0"
edition = "2021"
authors = ["Principal Web3 Architect <solana-architect@enterprise.internal>"]
description = "Deterministic Solana BankingStage Transaction Ordering, Scheduling Engine & Telemetry Pipeline"

[dependencies]
solana-sdk = "1.18.15"
solana-program = "1.18.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
bincode = "1.3"
dashmap = "5.5"
itertools = "0.13"

[dev-dependencies]
criterion = "0.5"