[package]
name = "solana-scheduler-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-scheduler-core = { path = "../solana-scheduler-core" }
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.10"
warp = "0.3"