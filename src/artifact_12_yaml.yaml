version: '3.8'

services:
  ordering-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solana-banking-stage-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - THREAD_WORKERS=8
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  telemetry-agent:
    build:
      context: .
      dockerfile: Dockerfile.telemetry
    container_name: solana-validator-telemetry
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - ENTERPRISE_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    depends_on:
      - ordering-engine