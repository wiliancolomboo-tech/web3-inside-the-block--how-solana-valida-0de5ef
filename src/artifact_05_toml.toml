[package]
name = "sbe-ia"
version = "1.0.0"
edition = "2021"

[lib]
name = "sbe_ia"
path = "src/engine.rs"

[[bin]]
name = "sbe-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
hex = "0.4.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
tokio = { version = "1.35", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"